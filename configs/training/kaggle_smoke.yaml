# SMOKE config — ne trenira ozbiljno; dokazuje da pipeline radi na Kaggle T4.
# Cilj: "možemo li učitati Qwen3.5-2B i izvršiti LoRA korak?" (kvota: minute)
mode: smoke
model_name: alphaedge-ai/Qwen3.5-2B-bos-32768
model_revision: 2f89b8332c352d01adebd88bba5d8a2f7adf8bd6  # pin: main 2026-05-20
dataset: shaban2024/agentmujo-function-calling   # tiny split dovoljan za smoke
dataset_revision: null  # pinovati SHA prije prvog runa
split: train
max_samples: 32        # tiny subset — štedi kvotu
output_dir: outputs/smoke
max_seq_length: 512    # kratko — samo forward/backward/save/reload
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4  # irelevantno za smoke, ostaje kao default
num_train_epochs: 1
warmup_ratio: 0.05
weight_decay: 0.0
logging_steps: 5
save_steps: 50
save_total_limit: 1
gradient_checkpointing: true   # manje VRAM-a (T4 16GB siguran)
load_in_4bit: true             # smoke sigurno staje; dev/prod idu bf16
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]  # uži skup = brži smoke
seed: 42
loss_type: nll  # chunked_nll puca na PEFT+transformers5 (partial bug); nll je standardni SFT loss
resume_from_checkpoint: null
