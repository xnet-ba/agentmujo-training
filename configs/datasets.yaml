# Dataset registar — dataseti žive na HF Hubu, ovdje su samo manifeste i verzije.
datasets:
  - { name: agentmujo-function-calling,    version: 0.1.0, split: canonical, file: datasets/canonical/function_calling_v0.1.jsonl,    status: frozen-612-484-63-65, splits: datasets/splits/fc, hf_repo: shaban2024/agentmujo-function-calling, hf_revision: af98997edc265e0392cae65ae4b4c616973d5328 }
  - { name: agentmujo-agentic-terminal,    version: 0.1.0, split: canonical, file: datasets/canonical/agentic_terminal_v0.1.jsonl,    status: frozen-341-286-23-32, splits: datasets/splits/ag, hf_repo: shaban2024/agentmujo-agentic-terminal, hf_revision: 099796c51290d61aa36cf609de852e59ffc8698f }
  - { name: agentmujo-tool-selection,      version: null, status: planned }
  - { name: agentmujo-argument-generation, version: null, status: planned }
  - { name: agentmujo-verification,        version: null, status: planned }
  - { name: agentmujo-safety,              version: null, status: planned }
  - { name: agentmujo-bosnian-core,        version: 0.1.0, split: canonical, file: datasets/canonical/bosnian_core_v0.1.jsonl, status: series1-30-validated, hf_repo: shaban2024/agentmujo-bosnian-core, hf_revision: 653436dfe1d29dc2c50f5cf845758928b6f13edc }
  - { name: agentmujo-linux-diagnostics,   version: null, status: planned }
  - { name: agentmujo-business,            version: null, status: planned }

quality_tiers: [GOLD, SILVER, BRONZE, REJECT]
mvp_target_sizes:
  function_calling: 100-300   # v0.1 isporučuje starter podskup; širenje nakon validacije pipelinea
  agentic_terminal: 100-300
rules:
  - train/valid/test su disjunktni; bez leakagea (deduplikacija po normaliziranom sadržaju)
  - svaki uzorak: stabilan ID, verzija, jezik, zadatak, težina, metadata, izvor, verification status
  - benchmark je POTPUNO odvojen od training skupova
