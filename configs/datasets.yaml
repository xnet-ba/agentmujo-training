  - { name: agentmujo-agentic-terminal,    version: 0.1.0, split: canonical, file: datasets/canonical/agentic_terminal_v0.1.jsonl,    status: frozen-616-499-50-52+S41, splits: datasets/splits/ag, hf_repo: shaban2024/agentmujo-agentic-terminal, hf_revision: 39217408f3c4781f2290129e66f66514d7d9c5cd }
  - { name: agentmujo-tool-selection,      version: null, status: planned }
  - { name: agentmujo-argument-generation, version: null, status: planned }
  - { name: agentmujo-verification,        version: null, status: planned }
  - { name: agentmujo-safety,              version: null, status: planned }
  - { name: agentmujo-bosnian-core,        version: 0.1.0, split: canonical, file: datasets/canonical/bosnian_core_v0.1.jsonl, status: frozen-1118-893-127-98, hf_repo: shaban2024/agentmujo-bosnian-core, hf_revision: 0d03a98fc2373ad22b7349ee173c1cba34458a0f }
