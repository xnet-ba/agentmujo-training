  - { name: agentmujo-agentic-terminal,    version: 0.1.0, split: canonical, file: datasets/canonical/agentic_terminal_v0.1.jsonl,    status: frozen-541-450-42-49, splits: datasets/splits/ag, hf_repo: shaban2024/agentmujo-agentic-terminal, hf_revision: 66087544ba75c5678ba8a1b0b82a3d7c1b94772e }
  - { name: agentmujo-tool-selection,      version: null, status: planned }
  - { name: agentmujo-argument-generation, version: null, status: planned }
  - { name: agentmujo-verification,        version: null, status: planned }
  - { name: agentmujo-safety,              version: null, status: planned }
  - { name: agentmujo-bosnian-core,        version: 0.1.0, split: canonical, file: datasets/canonical/bosnian_core_v0.1.jsonl, status: frozen-1060-847-121-92, hf_repo: shaban2024/agentmujo-bosnian-core, hf_revision: 20feadb0be28dee8146c016edc9a8a129080d5d4 }
