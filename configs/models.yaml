# Model registar — model-agnostičan dizajn (Qwen je prvi target, ne jedini).
models:
  - id: qwen3.5-2b-bos-32768
    hf_repo: alphaedge-ai/Qwen3.5-2B-bos-32768
    revision: 2f89b8332c352d01adebd88bba5d8a2f7adf8bd6  # main, 2026-05-20; pinovati prije treninga
    family: qwen3_5
    architecture: Qwen3_5ForConditionalGeneration
    params: 1771791168
    vocab_size: 32768
    context_native: 262144
    context_deploy: 32768          # ciljani operativni kontekst (ime modela)
    license: apache-2.0
    base_model: Qwen/Qwen3.5-2B
    adaptation: vocabulary-trimming (fineweb-2, 200k tekstova)
    chat_template:
      tool_format: "<tool_call><function=NAME><parameter=P>..</parameter></function></tool_call>"
      result_format: "<tool_response>..</tool_response>"
      thinking_open: "<think>"
      thinking_close: "</think>"
      # enable_thinking=true  -> "<think>\n" (model reasoning)
      # enable_thinking=false -> "<think>\n\n</think>\n\n" (non-thinking)
    thinking: { supported: true, mode: inference_flag, param: enable_thinking }
    tools: { supported: true, mechanism: chat_template_tools_param }
    load_class: AutoModelForCausalLM  # tekstualni put; HF meta navodi i AutoModelForMultimodalLM
    dtype: bfloat16
    role: base_bosnian
    status: verified-metadata-only  # težine NISU još preuzete na Oracle (namjerno)

  # Šablon za buduće modele 0.5B–4B (samo dodati unos, bez redizajna):
  # - id: neki-drugi-2b
  #   hf_repo: org/model
  #   family: ...

  - id: qwen3.5-4b-bos-32768
    hf_repo: alphaedge-ai/Qwen3.5-4B-bos-32768
    revision: 34a621915a6214ab9d28f74142840d8cd5bc0acb  # main; pinovati prije treninga
    family: qwen3_5
    architecture: Qwen3_5ForConditionalGeneration
    params: ~3200000000
    vocab_size: 32768
    context_native: 262144
    context_deploy: 32768
    license: apache-2.0
    base_model: Qwen/Qwen3.5-4B
    adaptation: vocabulary-trimming (fineweb-2)
    chat_template:
      tool_format: "<tool_call><function=NAME><parameter=P>..</parameter></function></tool_call>"
      result_format: "<tool_response>..</tool_response>"
      thinking_open: "<think>"
      thinking_close: "</think>"
    thinking: { supported: true, mode: inference_flag, param: enable_thinking }
    tools: { supported: true, mechanism: chat_template_tools_param }
    load_class: AutoModelForCausalLM
    dtype: bfloat16
    role: base_bosnian_4b
    status: verified-metadata-only
    text_config: { hidden_size: 2560, num_hidden_layers: 32, num_attention_heads: 16, num_key_value_heads: 4, intermediate_size: 9216, head_dim: 256 }

