[project]
name = "agentmujo-training"
version = "0.1.0"
description = "Reproducibilan framework za fine-tuning malih jezičkih modela za bosanski jezik (AgentMujo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentMujo Team" }]
keywords = ["llm", "fine-tuning", "bosnian", "function-calling", "agents"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.57",
    "trl>=0.12",
    "peft>=0.12",
    "accelerate>=0.33",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
eval = [
    "scikit-learn>=1.3",
]

[project.scripts]
amj = "agentmujo_training.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
