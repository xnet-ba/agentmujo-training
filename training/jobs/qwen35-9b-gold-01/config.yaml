# 9B-GOLD-01 — dialect-dense SFT (samo redovi sa tool_calls iz joint v0.40).
# Hipoteza: koncentrisani dijalekt (r64, 1 epoha) instalira format koji
# difuzni joint mixevi (v0.32-0.35) nisu instalirali u 9 epoha.
# Subset: scripts/build_9b_gold.py (4246 redova: AG hard + AG med 1200 +
# FC hard + verification + tool-selection + reasoning hard). Bez BC/safety.
# A100 80GB: bf16, BEZ gradient checkpointinga (brzina), batch 2x8.
experiment_id: qwen35-9b-gold-01
mode: sft
model_name: Qwen/Qwen3.5-9B
model_revision: c20223623576
base_adapter: null
dataset: local
data_file: /tmp/gold_v1.jsonl
split: train
max_samples: null
output_dir: outputs/9b-gold-01
max_seq_length: 1024
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
